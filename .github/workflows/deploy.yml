name: Deploy Auth Service to Cloud Run

on:
  push:
    branches:
      - prod

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  DEPLOY_REGION: us-central1
  REGISTRY_REGION: asia-south1
  SERVICE_NAME: ecommerce-auth-service
  IMAGE_NAME: asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ecommerce-repo/ecommerce-auth-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY_REGION }}-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE_NAME:${{ github.sha }} \
            --platform managed \
            --region $DEPLOY_REGION \
            --allow-unauthenticated \
            --port 8080 \
            --add-cloudsql-instances ${{ secrets.INSTANCE_CONNECTION_NAME }} \
            --set-env-vars INSTANCE_CONNECTION_NAME=${{ secrets.INSTANCE_CONNECTION_NAME }},DB_NAME=auth_db,DB_USER=${{ secrets.DB_USER }},DB_PASS=${{ secrets.DB_PASS }},JWT_SECRET=${{ secrets.JWT_SECRET }}